# Old Netlify settings, kept only until the Netlify site is switched off.
# The app now deploys on Cloudflare Pages (root directory app, build
# command npm run build, output dist). Headers live in public/_headers and
# page routing in public/_redirects.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
