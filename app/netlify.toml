# Netlify settings for the members app (a second Netlify site, separate from
# the marketing site). In Netlify: Site configuration -> Build & deploy ->
# Base directory = app. Everything else is read from this file.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One-page app: every address loads index.html and the app picks the screen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://uibywuqdbkubqqumwzuw.supabase.co; font-src 'self'; connect-src 'self' https://uibywuqdbkubqqumwzuw.supabase.co wss://uibywuqdbkubqqumwzuw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# The trusted-contact page holds a private code in its address: never pass
# it on to other pages, and never keep a copy in a shared cache.
[[headers]]
  for = "/safe/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
