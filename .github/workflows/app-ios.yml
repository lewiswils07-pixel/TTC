# Backup iPhone build on GitHub's Mac machines, for when Lewis's Mac isn't to
# hand. Run it by hand (Actions -> iPhone build -> Run workflow): Mac minutes
# count 10x against the free allowance, so it doesn't run on every change.
# It builds for the simulator only; signed TestFlight builds come in week 5.
name: iPhone build

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the web app and copy it into the iPhone project
        working-directory: app
        run: |
          npm ci
          npm run cap:sync
      - name: Build for the iPhone simulator
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
