# Checks every change to the members app and its database before it lands:
# lint, type check, unit tests and build for the app; pgTAP security tests
# for the database; and a debug Android build of the phone app.
name: Members app CI

on:
  pull_request:
    paths: ['app/**', 'supabase/**', '.github/workflows/app-ci.yml']
  push:
    branches: [main]
    paths: ['app/**', 'supabase/**', '.github/workflows/app-ci.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist
          retention-days: 7

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local database with all migrations and seed data
        run: supabase db start
      - name: Run the security tests
        run: supabase test db

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app and copy it into the Android project
        working-directory: app
        run: |
          npm ci
          npm run cap:sync
      - name: Build a debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
