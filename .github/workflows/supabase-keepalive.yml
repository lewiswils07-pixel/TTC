# Free Supabase projects pause after about a week without activity. This pings
# the project every 3 days so the sign-up form keeps working. Remove it once
# the project is on the Pro plan (Pro projects never pause).
#
# GitHub only runs scheduled workflows from the default branch (main), and
# turns them off after 60 days with no commits to the repo; it emails you
# if that happens, and "Enable workflow" in the Actions tab turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database
        env:
          # Public anon key, the same one the website uses (safe to publish).
          SUPABASE_URL: https://uibywuqdbkubqqumwzuw.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpYnl3dXFkYmt1YnFxdW13enV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDc4NDEsImV4cCI6MjEwNTk4Mzg0MX0.RaXfnoFr48-9CD0dvuQBLDlEb4un3a-Fyo5eVDa784k
        run: |
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
